<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#grad)"/>
  <g transform="translate(16, 14)">
    <!-- Simplified tattoo machine -->
    <path d="M-6,-8 L6,-8 L7,-6 L7,2 L5,4 L5,8 L3,10 L-3,10 L-5,8 L-5,4 L-7,2 L-7,-6 Z" fill="white" opacity="0.95"/>
    <!-- Needle -->
    <line x1="0" y1="10" x2="0" y2="14" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <!-- Grip lines -->
    <line x1="-4" y1="-5" x2="4" y2="-5" stroke="#A78BFA" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-4" y1="-2" x2="4" y2="-2" stroke="#A78BFA" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
