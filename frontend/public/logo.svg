<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)"/>

  <!-- Inner glow ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

  <!-- Tattoo Machine Stylized Icon -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Machine body -->
    <path d="M-60,-80 L60,-80 L70,-60 L70,20 L50,40 L50,80 L30,100 L-30,100 L-50,80 L-50,40 L-70,20 L-70,-60 Z"
          fill="white" opacity="0.95"/>

    <!-- Grip texture lines -->
    <line x1="-40" y1="-50" x2="40" y2="-50" stroke="url(#accentGradient)" stroke-width="4" stroke-linecap="round"/>
    <line x1="-40" y1="-30" x2="40" y2="-30" stroke="url(#accentGradient)" stroke-width="4" stroke-linecap="round"/>
    <line x1="-40" y1="-10" x2="40" y2="-10" stroke="url(#accentGradient)" stroke-width="4" stroke-linecap="round"/>

    <!-- Needle -->
    <path d="M0,100 L0,160" stroke="white" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="165" r="8" fill="white"/>

    <!-- Coils decoration -->
    <ellipse cx="-45" cy="0" rx="15" ry="25" fill="none" stroke="url(#accentGradient)" stroke-width="4"/>
    <ellipse cx="45" cy="0" rx="15" ry="25" fill="none" stroke="url(#accentGradient)" stroke-width="4"/>

    <!-- Top connector -->
    <rect x="-20" y="-95" width="40" height="20" rx="5" fill="white" opacity="0.9"/>
  </g>

  <!-- Sparkle effects -->
  <g fill="white" opacity="0.8">
    <circle cx="380" cy="120" r="6"/>
    <circle cx="400" cy="140" r="3"/>
    <circle cx="130" cy="380" r="5"/>
    <circle cx="110" cy="360" r="3"/>
  </g>

  <!-- Circular text path (optional decorative) -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" stroke-dasharray="10,5"/>
</svg>
